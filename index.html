<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poem Generator</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="container">
    <h1>Poem Generator</h1>
    <form id="poemForm">
      <label for="theme">Enter a theme for your poem:</label><br />
      <input placeholder="Enter a text..." type="text" id="theme" name="theme" required /><br /><br />
      <input class="button" type="submit" value="Generate" />
    </form>

    <div id="poemBox" class="poem-box">
      <div id="poem"></div>
    </div>

    <footer>
      This is coded by 
      <a href="https://github.com/Nononyiko" target="_blank">Tinyiko</a>
      and is hosted on 
      <a href="https://app.netlify.com/teams/nononyiko/projects" target="_blank">Netlify</a>.
    </footer>
  </div>

  <script src="src/script.js"></script>
</body>
</html>
